<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192320" />
      <stop offset="100%" stop-color="#0C1110" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FD1B9" />
      <stop offset="100%" stop-color="#1E6B5C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B5" />
      <stop offset="100%" stop-color="#C8AA78" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Arch Background -->
  <path d="M 0 200 C 0 89.5 89.5 0 200 0 C 310.5 0 400 89.5 400 200 L 400 500 L 0 500 Z" fill="url(#bgGrad)" />
  <path d="M 0 200 C 0 89.5 89.5 0 200 0 C 310.5 0 400 89.5 400 200 L 400 500 L 0 500 Z" fill="url(#grid)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="280" cy="160" r="110" fill="url(#tealGrad)" opacity="0.35" filter="blur(30px)" />
  <circle cx="120" cy="270" r="90" fill="url(#goldGrad)" opacity="0.25" filter="blur(25px)" />

  <!-- Geometric Accent Rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(127, 209, 185, 0.2)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Stylized Figure Silhouette -->
  <g id="figure" transform="translate(0, 15)">
    <!-- Head -->
    <circle cx="200" cy="180" r="54" fill="#141D1A" stroke="#7FD1B9" stroke-width="2" />
    <!-- Glasses / Modern Dev Detail -->
    <rect x="168" y="170" width="26" height="16" rx="4" fill="none" stroke="#E8E6DF" stroke-width="2" />
    <rect x="206" y="170" width="26" height="16" rx="4" fill="none" stroke="#E8E6DF" stroke-width="2" />
    <line x1="194" y1="178" x2="206" y2="178" stroke="#E8E6DF" stroke-width="2" />

    <!-- Shoulders & Torso -->
    <path d="M 95 390 C 95 285 145 255 200 255 C 255 255 305 285 305 390 L 95 390 Z" fill="#141D1A" stroke="#7FD1B9" stroke-width="2" />
    
    <!-- Code / Collar Accent -->
    <path d="M 175 255 L 200 295 L 225 255" fill="none" stroke="#C8AA78" stroke-width="2.5" />
  </g>

  <!-- Editorial Badge Bottom Overlay -->
  <g transform="translate(80, 420)">
    <rect width="240" height="42" rx="21" fill="rgba(12, 17, 16, 0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#7FD1B9" />
    <text x="40" y="26" fill="#E8E6DF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.5">ALBERTO FERRARI</text>
  </g>
</svg>
